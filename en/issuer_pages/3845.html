hden on osnovanii mezhgosudarstvennogo soglasheniya, podpisannogo 12 yanvarya 2006 year upolnomochennymi predstavitelyami rossiyskoy Federation and respubliki kazakhstan. initsiativa sozdaniya banka prinadlezhit prezidentam rossii and kazakhstana.\r\neabr otkryt for vstupleniya novykh uchastnikov. gosudarstva and mezhdunarodnye organizatsii stanovyatsya ego uchastnikami by resheniyu soveta banka posle ikh prisoedineniya to soglasheniyu ob uchrezhdenii eabr and oplaty in ustanovlennom poryadke priobretaemykh aktsiy banka.\r\nin 2009 godu respublika armeniya and respublika tadzhikistan, in 2010 godu - respublika belarus, a in 2011 godu - kyrgyzskaya respublika stali polnopravnymi uchastnikami banka.\r\nglavnym itogom proshedshikh years raboty eabr yavlyaetsya zavershenie stanovleniya banka kak priznannogo mezhdunarodnogo finansovogo instituta razvitiya so spetsializatsiey on regionalnoy integratsii.\r\ndeyatelnost banka napravlena kak on sozdanie usloviy for ustoychivogo ekonomicheskogo razvitiya and uglublenie integratsionnykh protsessov mezhdu gosudarstvami-uchastnikami eabr, tak and on reshenie zadach by preodoleniyu imi posledstviy mirovogo finansovo-ekonomicheskogo krizisa.\r\nprioritetnymi zadachami eabr yavlyayutsya:\r\nprivlechenie novykh gosudarstv-uchastnikov;\r\nfinansirovanie investitsionnykh proektov, imeyushchikh integratsionnyy effekt;\r\npredostavlenie tekhnicheskogo sodeystviya in realizatsii proektov, imeyushchikh integratsionnyy effekt;\r\nosushchestvlenie issledovaniy by voprosam ekonomicheskoy integratsii;\r\nobespechenie sbalansirovannoy diversifikatsii investitsionnogo portfolio by regionam gosudarstv-uchastnikov.\r\neabr yavlyaetsya upravlyayushchim sredstvami antikrizisnogo fonda evrazes (akf).\r\nbank finansiruet in gosudarstvakh-uchastnikakh investment proekty on obshchuyu summu svyshe 4,5 bn. dollarov.\r\neabr priderzhivaetsya samykh vysokikh prirodookhrannykh norm and investiruet in proekty, kotorye otvechayut ego ekologicheskim kriteriyam.\r\nmezhdunarodnymi agentstvami banku prisvoeny kreditnye reytingi on urovne suverennykh reytingov gosudarstv-uchrediteley eabr and vyshe. eto obespechivaet emu komfortnyy dostup to mezhdunarodnym and natsionalnym finansovym rynkam.\r\nustavnyy kapital banka prevyshaet 1,5 milliarda dollarov ssha.\r\non sformirovan for schet vznosov gosudarstv-uchastnikov in razmere: rossiya - 1 bn, kazakhstan - 500 mn, belarus - 15 mn, tadzhikistan - 500 thousandyach, armeniya - 100 thousandyach, kyrgyzstan - 100 thousandyach dollarov ssha.\r\nbank imeet status mezhdunarodnoy organizatsii. kak subekt mezhdunarodnogo prava, eabr:\r\nobladaet mezhdunarodnoy pravosposobnostyu;\r\npolzuetsya pravami yuridicheskogo litsa on territorii gosudarstv-uchastnikov;\r\nraspolagaet osobym yuridicheskim statusom, podrazumevayushchim nadelenie ego on territorii uchastnikov takimi privilegiyami and lgotami, kak:\r\n- imushchestvennyy and sudebnyy immunitety;\r\n- nalogovye and tamozhennye osvobozhdeniya;\r\n- preimushchestva, pozvolyayushchie izbegat izderzhek and riskov, vyzvannykh vozmozhnym izmeneniem zakonodatelstva and bankovskogo regulirovaniya in gosudarstvakh-uchastnikakh.\r\nin 2007 godu bank poluchil status nablyudatelya in generalnoy assamblee oon, in 2008 godu - nablyudatelya under evrazes and under evraziyskoy gruppe by protivodeystviyu legalizatsii prestupnykh dokhodov and finansirovaniyu terrorizma (eag).\r\neabr osushchestvlyaet operatsionnuyu deyatelnost in tekh stranakh, with pravitelstvami kotorykh bankom podpisany and in kotorykh vstupili in zakonnuyu silu soglasheniya ob usloviyakh ego prebyvaniya on ikh territorii.\r\nshtab-kvartira eabr raspolozhena in almaty.\r\nbank imeet filial in sankt-peterburge, predstavitelstva in moskve, astane, dushanbe, erevane, minske and bishkeke. Evraziyskiy bank razvitiya","issuer_id":"3845","issuer_name":"Evraziyskiy bank razvitiya","href":"../asset/index.html?id=RU000A1057B8"},{"id":709,"secid":"RU000A105EV1","source_secid":"RU000A105EV1","bo
