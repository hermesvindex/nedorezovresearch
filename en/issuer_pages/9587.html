oyarskneftegaz\" and \"baykitskaya neftegazorazvedochnaya ekspeditsiya\"), osnovnye moshchnosti kotorykh sosredotocheny in krasnoyarskom krae. dobytaya oil postupaet in sistemu magistralnogo nefteprovoda \"kuyumba-tayshet\". neftepererabatyvayushchiy kompleks \"slavnefti\" vklyuchaet dva krupnykh predpriyatiya – \"slavneft-yanos\" (rf) and \"mozyrskiy npz\" (rb). \r\ndebyutnyy issue bonds \"slavneft\" byl osushchestvlen in 2001 years, kogda byli razmeshcheny 1-years. diskontnye bumagi on 1 RUB bnley, in kachestve andderaytera vystupila ik \"troyka dialog\" (seychas sber cib). stoit otmetit, chto with 2003 years by 2018 years, company ne vykhodila on vnutrenniy dolgovoy rynok, under etom nikogda ne osushchestvlyala zaymov on mezhdunarodnom rynke. Public Joint-Stock Company \"Neftegazovaya company \"Slavneft\"","issuer_id":"9587","issuer_name":"Public Joint-Stock Company \"Neftegazovaya company \"Slavneft\"","href":"../asset/index.html?id=RU000A103PD0"},{"id":504,"secid":"RU000A103PG3","source_secid":"RU000A103PG3","board":"TQCB","title":"SLAVNEFT 002P-02","subtitle":"SLAVNEFT 002P-02 SLAVNEFT 002P-02","isin":"RU000A103PG3","bond_class":"Corporate","price_pct":null,"nominal_value":1000.0,"nominal_currency":"RUB","nominal_display":"1 000 RUB","coupon_rate_pct":7.75,"current_yield_pct":null,"raw_coupon_rate_pct":7.75,"raw_current_yield_pct":null,"ytm_pct":null,"ytm_moex_pct":null,"ytm_calc_pct":null,"key_rate_pct":null,"coupon_spread_pct":null,"current_yield_spread_pct":null,"ytm_spread_pct":null,"zspread_pct":null,"coupon_is_forecast":false,"ytm_is_forecast":false,"floater_spread_estimate_pct":null,"forecast_key_rate_pct":null,"coupon_type":"Fixed rate","coupon_frequency":4.0,"next_coupon_date":"2026-09-08","maturity_date":"2031-09-02","credit_rating":"AA","duration_years":null,"face_currency":"RUB","accint":9.13,"dirty_price":null,"annual_coupon_amount":77.28,"monthly_turnover":0.0,"avg_daily_turnover":0.0,"weekly_turnover":0.0,"avg_week_turnover":0.0,"avg_turnover":0
