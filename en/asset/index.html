<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Asset profile · Nedorezov Research</title>
  <link rel="stylesheet" href="../../shared/bilingual-switcher.css?v=20260925-public-layout-2" data-nr-bilingual-switcher>
  <script src="../../shared/bilingual-switcher.js?v=20260925-public-layout-2" data-nr-locale="en" data-nr-bilingual-switcher data-nr-public-root="true" defer></script>
</head>
<body>
  <script src="manifest.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const id = params.get("id") || decodeURIComponent(location.hash.slice(1)) || "SBER";
      if (!window.NED_ASSET_MANIFEST || !window.NED_ASSET_VARIANTS) {
        const command = location.pathname.includes("/nedorezov_light/")
          ? "commands/05_OPEN_LIGHT.command" : "commands/04_OPEN_PLUS.command";
        document.body.innerHTML = '<main style="max-width:720px;margin:48px auto;padding:24px;font:16px/1.5 system-ui"><h1>Open the site using the local command</h1><p></p></main>';
        document.querySelector("p").textContent = "Safari blocked the local profile files. Run " + command + " from the Ned_research project root.";
        return;
      }
      const variant = window.NED_ASSET_VARIANTS[id];
      if (!window.NED_ASSET_MANIFEST[id] || !variant) {
        document.body.innerHTML = '<main style="max-width:720px;margin:48px auto;padding:24px;font:16px/1.5 system-ui"><h1>Asset not found</h1><p></p></main>';
        document.querySelector("p").textContent = id;
        return;
      }
      const target = new URL("card-" + variant + ".html", location.href);
      target.search = location.search;
      target.searchParams.set("id", id);
      target.hash = location.hash;
      location.replace(target.href);
    }());
  </script>
</body>
</html>
