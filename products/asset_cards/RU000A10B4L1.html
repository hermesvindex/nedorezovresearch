<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Девар Петро БО-П01 · Карточка актива</title>
  <link rel="stylesheet" href="../assets/integration-shell.css">
  <script src="../assets/vendor/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg-a: #edf3f7;
      --bg-b: #faf7ef;
      --bg-c: #f6fbf7;
      --ink: #101215;
      --muted: rgba(16, 18, 21, .62);
      --faint: rgba(16, 18, 21, .42);
      --line: rgba(255, 255, 255, .72);
      --glass: rgba(255, 255, 255, .56);
      --glass-strong: rgba(255, 255, 255, .76);
      --shadow: 0 28px 86px rgba(25, 34, 48, .17);
      --radius: 30px;
      --accent: #7A1027;
      --accent-soft: rgba(122, 16, 39, .16);
      --panel: rgba(255,255,255,.55);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(71, 115, 135, .14), transparent 31%),
        linear-gradient(230deg, rgba(199, 139, 79, .18), transparent 36%),
        linear-gradient(165deg, var(--bg-a) 0%, var(--bg-b) 48%, var(--bg-c) 100%);
      padding: clamp(16px, 3vw, 42px);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.42) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.45), transparent 72%);
    }
    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }
    .asset-switcher {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 22px;
      background: rgba(255,255,255,.42);
      backdrop-filter: blur(28px) saturate(170%);
      box-shadow: 0 16px 46px rgba(32, 42, 64, .11);
    }
    .switch-group, .range-group, .mode-group { display: flex; gap: 7px; flex-wrap: wrap; }
    button {
      border: 0;
      min-height: 44px;
      border-radius: 15px;
      padding: 0 14px;
      font: 700 13px/1 system-ui, sans-serif;
      color: rgba(16,18,21,.72);
      background: rgba(255,255,255,.58);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 8px 20px rgba(20,32,56,.08);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, color .18s ease;
    }
    button:hover { transform: translateY(-1px); }
    button.active {
      color: #fff;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent), #0b1f16 6%), color-mix(in srgb, var(--accent), #ffffff 18%));
    }
    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.76), rgba(255,255,255,.44)),
        linear-gradient(220deg, color-mix(in srgb, var(--accent), white 88%), rgba(255,255,255,.26));
      backdrop-filter: blur(36px) saturate(180%);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.88);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, rgba(255,255,255,.72), transparent 26%),
        linear-gradient(145deg, var(--accent-soft), transparent 36%);
      pointer-events: none;
    }
    .content {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, .9fr);
      gap: clamp(18px, 3vw, 34px);
      padding: clamp(18px, 3vw, 34px);
    }
    .topline {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    .logo {
      width: 74px;
      height: 74px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--accent);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 16px 38px color-mix(in srgb, var(--accent), transparent 72%);
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .logo-fallback { color: #fff; font-weight: 900; font-size: 22px; }
    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 1.02;
      letter-spacing: 0;
    }
    .subtitle {
      margin-top: 10px;
      max-width: 720px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }
    .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
    .chip {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0 11px;
      font-size: 12px;
      font-weight: 800;
      color: rgba(16,18,21,.7);
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(255,255,255,.74);
    }
    .chip.tint { color: color-mix(in srgb, var(--accent), #052515 38%); background: var(--accent-soft); }
    .price-panel {
      margin-top: clamp(22px, 4vw, 44px);
      display: grid;
      grid-template-columns: .84fr 1.16fr;
      gap: 16px;
      align-items: stretch;
    }
    .quote {
      min-height: 142px;
      padding: 20px;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75);
    }
    .quote-value { font-size: clamp(30px, 5vw, 58px); line-height: .92; font-weight: 900; letter-spacing: 0; white-space: nowrap; }
    .quote-rub { margin-top: 8px; color: var(--muted); font-size: 18px; font-weight: 750; }
    .delta { margin-top: 12px; font-size: 17px; font-weight: 850; color: #6a7077; }
    .delta.positive { color: #04884f; }
    .delta.negative { color: #c5203d; }
    body.key-rate-card .delta,
    body.key-rate-card .delta.positive,
    body.key-rate-card .delta.negative { color: #6a7077; }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .metric {
      min-height: 66px;
      min-width: 0;
      padding: 13px 14px;
      border-radius: 19px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.68);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
      overflow: hidden;
    }
    .metric.hot { background: rgba(255,255,255,.50); }
    .metric-value { font-size: 22px; line-height: 1.05; font-weight: 900; color: rgba(16,18,21,.90); overflow-wrap: normal; word-break: normal; hyphens: none; }
    .metric-value.text { font-size: 18px; line-height: 1.1; overflow-wrap: normal; word-break: normal; }
    .metric-value.long { font-size: 16px; line-height: 1.13; }
    .metric-value.date { font-size: 17px; font-weight: 780; color: var(--muted); }
    .metric-label { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.12; }
    .metric-note { margin-top: 5px; color: var(--faint); font-size: 11px; line-height: 1.15; overflow-wrap: normal; word-break: normal; hyphens: none; }
    .returns-grid {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .return-pill {
      min-width: 0;
      border-radius: 15px;
      padding: 10px 11px;
      background: rgba(255,255,255,.46);
      border: 1px solid rgba(255,255,255,.62);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.66);
    }
    .return-label { color: var(--muted); font-size: 11px; font-weight: 780; line-height: 1; }
    .return-value { margin-top: 5px; font-size: 15px; line-height: 1; font-weight: 900; color: #6a7077; white-space: nowrap; }
    .return-value.positive { color: #04884f; }
    .return-value.negative { color: #c5203d; }
    .return-note { margin-top: 5px; color: var(--faint); font-size: 10px; font-weight: 720; line-height: 1; white-space: nowrap; }
    .chart-panel {
      margin-top: 18px;
      padding: 14px 14px 10px;
      border-radius: 26px;
      background: rgba(255,255,255,.48);
      border: 1px solid rgba(255,255,255,.66);
    }
    .detail-cta {
      display: none;
      margin-top: 16px;
      justify-content: flex-start;
    }
    .detail-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent), transparent 72%);
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 760;
      box-shadow: 0 10px 22px color-mix(in srgb, var(--accent), transparent 76%);
    }
    .detail-link:hover {
      background: color-mix(in srgb, var(--accent), #101827 15%);
    }
    #chart { height: 354px; width: 100%; }
    .chart-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .chart-toolbar .range-group { justify-content: flex-end; }
    .chart-toolbar .range-group button { padding: 0 10px; }
    .side {
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .tiles {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .tile, .section {
      border-radius: 21px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.68);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
    }
    .tile { min-height: 83px; min-width: 0; padding: 15px; overflow: hidden; }
    .tile strong {
      display: block;
      max-width: 100%;
      font-size: 19px;
      line-height: 1.08;
      overflow-wrap: anywhere;
      word-break: normal;
      text-wrap: balance;
    }
    .tile strong.fit {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(13px, var(--fit-size, 19px), 19px);
    }
    .tile strong.money { white-space: nowrap; overflow-wrap: normal; }
    .tile-date { display: inline-block; margin-left: 5px; color: var(--muted); font-size: 13px; font-weight: 780; white-space: nowrap; vertical-align: baseline; }
    .tile-date.solo { margin-left: 0; font-size: 16px; }
    .tile span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.15; }
    .section { padding: 16px; }
    .section h2 { margin: 0 0 12px; font-size: 16px; line-height: 1; }
    .desc { color: rgba(16,18,21,.72); font-size: 13px; line-height: 1.46; }
    .formula {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      padding: 12px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--accent-soft), white 42%);
      color: rgba(16,18,21,.72);
      font-size: 12px;
      line-height: 1.35;
    }
    .formula strong { color: color-mix(in srgb, var(--accent), #071c12 44%); font-size: 15px; }
    .cashflow { display: grid; gap: 8px; max-height: 420px; overflow: auto; padding-right: 3px; }
    .flow-row {
      min-height: 46px;
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 8px 11px;
      border-radius: 14px;
      background: rgba(255,255,255,.45);
    }
    .flow-date, .flow-note { color: var(--muted); font-size: 12px; }
    .flow-row.past { opacity: .72; }
    .flow-main { min-width: 0; }
    .flow-title { font-size: 13px; font-weight: 850; color: rgba(16,18,21,.74); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flow-value { font-size: 14px; font-weight: 850; text-align: right; white-space: nowrap; }
    body.key-rate-card .content {
      grid-template-columns: minmax(0, 1.18fr) minmax(330px, .82fr);
    }
    body.key-rate-card .price-panel {
      grid-template-columns: minmax(0, 1fr);
      margin-top: clamp(22px, 3vw, 34px);
    }
    body.key-rate-card .quote {
      min-height: 0;
      padding: 22px 24px;
    }
    body.key-rate-card .metric-grid,
    body.key-rate-card .returns-grid,
    body.key-rate-card .tiles,
    body.key-rate-card .side > .section:first-of-type {
      display: none;
    }
    body.key-rate-card .side {
      align-content: stretch;
    }
    body.key-rate-card .side > .section:last-child {
      min-height: 100%;
      padding: 20px;
    }
    body.key-rate-card .side > .section:last-child h2 {
      margin-bottom: 16px;
      font-size: 18px;
    }
    body.key-rate-card .cashflow {
      max-height: none;
      gap: 10px;
      overflow: visible;
      padding-right: 0;
    }
    body.key-rate-card .flow-row {
      grid-template-columns: 98px minmax(0, 1fr) auto;
      min-height: 64px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.68);
    }
    body.key-rate-card .flow-row.rate-forecast {
      background: color-mix(in srgb, var(--accent-soft), white 54%);
    }
    body.key-rate-card .flow-date {
      color: rgba(16,18,21,.78);
      font-size: 13px;
      font-weight: 850;
    }
    body.key-rate-card .flow-title {
      font-size: 14px;
    }
    body.key-rate-card .flow-note {
      margin-top: 4px;
      font-size: 11px;
    }
    body.key-rate-card .flow-value {
      font-size: 17px;
    }
    body.key-rate-card .rate-change {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    body.key-rate-card .rate-history-disclosure {
      margin-top: 12px;
    }
    body.key-rate-card .rate-history-disclosure summary {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      border: 1px solid rgba(16,18,21,.09);
      border-radius: 14px;
      color: rgba(16,18,21,.72);
      background: rgba(255,255,255,.52);
      font-size: 12px;
      font-weight: 820;
      cursor: pointer;
      list-style: none;
    }
    body.key-rate-card .rate-history-disclosure summary::-webkit-details-marker {
      display: none;
    }
    body.key-rate-card .rate-history-disclosure summary::after {
      content: "⌄";
      font-size: 18px;
      line-height: 1;
      transform: translateY(-2px);
      transition: transform .2s ease;
    }
    body.key-rate-card .rate-history-disclosure[open] summary::after {
      transform: rotate(180deg) translateY(2px);
    }
    body.key-rate-card .rate-history-disclosure .when-open,
    body.key-rate-card .rate-history-disclosure[open] .when-closed {
      display: none;
    }
    body.key-rate-card .rate-history-disclosure[open] .when-open {
      display: inline;
    }
    body.key-rate-card .rate-history-rows {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(16,18,21,.07);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    details.coupon-history {
      margin-top: 4px;
      border-radius: 18px;
      background: rgba(255,255,255,.34);
      border: 1px solid rgba(255,255,255,.58);
      overflow: hidden;
    }
    details.coupon-history summary {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 850;
      font-size: 12px;
      list-style: none;
    }
    details.coupon-history summary span:last-child { color: var(--muted); font-weight: 760; }
    details.coupon-history summary:focus { outline: none; }
    details.coupon-history summary:focus-visible { box-shadow: inset 0 0 0 2px rgba(16,18,21,.12); }
    details.coupon-history summary::-webkit-details-marker { display: none; }
    .coupon-table {
      display: grid;
      gap: 6px;
      max-height: 290px;
      overflow: auto;
      padding: 0 10px 10px;
    }
    .footer-note {
      color: var(--faint);
      font-size: 12px;
      padding: 0 clamp(18px, 3vw, 34px) clamp(18px, 3vw, 28px);
      position: relative;
    }
    body.in-drawer {
      padding: 0;
      background:
        linear-gradient(135deg, rgba(71, 115, 135, .12), transparent 35%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b), var(--bg-c));
    }
    body.in-drawer::before { display: none; }
    body.in-drawer .shell { width: 100%; }
    body.in-drawer .asset-switcher { display: none; }
    body.in-drawer .card {
      border-radius: 0;
      min-height: 100vh;
      border: 0;
      box-shadow: none;
    }
    body.in-drawer .content {
      grid-template-columns: 1fr;
      padding: 14px;
      gap: 14px;
    }
    body.in-drawer .metric-grid { grid-template-columns: 1fr 1fr; }
    body.in-drawer .chart-panel { margin-top: 14px; }
    body.in-drawer #chart { height: 290px; }
    body.in-drawer .footer-note { padding: 0 14px 18px; }
    @media (max-width: 980px) {
      .content { grid-template-columns: 1fr; }
      body.key-rate-card .content { grid-template-columns: 1fr; }
      .side { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      body { padding: 10px; }
      .asset-switcher { border-radius: 19px; }
      .content { padding: 14px; gap: 16px; }
      .topline { grid-template-columns: auto 1fr; }
      .logo { width: 62px; height: 62px; border-radius: 18px; }
      .price-panel, .tiles { grid-template-columns: 1fr; }
      .metric-grid { grid-template-columns: 1fr 1fr; }
      .returns-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .chart-toolbar .range-group { justify-content: flex-start; }
      #chart { height: 316px; }
      .flow-row { grid-template-columns: 82px minmax(0, 1fr) auto; }
      body.key-rate-card .flow-row { grid-template-columns: 92px minmax(0, 1fr) auto; }
      button { flex: 1 1 auto; }
    }
    @media (max-width: 640px), (max-height: 760px) {
      body.in-drawer .content { padding: 12px; gap: 12px; }
      body.in-drawer #chart { height: 270px; }
      body.in-drawer .footer-note { padding: 0 12px 16px; }
    }
  </style>

<body class="lg-root">
  <main class="shell">
    <nav class="asset-switcher">
      <div class="switch-group" id="assetButtons"></div>
    </nav>

    <article class="card" id="assetCard">
      <div class="content">
        <section>
          <div class="topline">
            <div class="logo" id="logo"></div>
            <div>
              <h1 id="title"></h1>
              <div class="subtitle" id="subtitle"></div>
              <div class="chips" id="chips"></div>
            </div>
          </div>

          <div class="detail-cta" id="detailCta"></div>

          <div class="price-panel">
            <div class="quote">
              <div class="quote-value" id="price"></div>
              <div class="quote-rub" id="dirtyPrice"></div>
              <div class="delta" id="delta"></div>
            </div>
            <div class="metric-grid" id="metrics"></div>
            <div class="returns-grid" id="periodReturns"></div>
          </div>

          <div class="chart-panel">
            <div class="chart-toolbar">
              <div class="mode-group lg-segmented asset-accent-segmented" id="modeButtons" role="tablist" aria-label="Показатель графика"><span class="lg-segmented__glider" aria-hidden="true"></span>
                <button type="button" data-mode="price" class="active" aria-selected="true">Цена</button>
                <button type="button" data-mode="yield" aria-selected="false">Доходность</button>
              </div>
              <div class="range-group lg-segmented asset-accent-segmented" id="rangeButtons" role="tablist" aria-label="Горизонт графика"><span class="lg-segmented__glider" aria-hidden="true"></span>
                <button type="button" data-range="D" aria-label="День">D</button>
                <button type="button" data-range="W" aria-label="Неделя">W</button>
                <button type="button" data-range="1M" aria-label="Один месяц">M</button>
                <button type="button" data-range="3M" aria-label="Три месяца">3М</button>
                <button type="button" data-range="6M" aria-label="Шесть месяцев">6М</button>
                <button type="button" data-range="YTD" aria-label="С начала года">YTD</button>
                <button type="button" data-range="1Y" aria-label="Один год">1Y</button>
                <button type="button" data-range="3Y" aria-label="Три года">3Y</button>
                <button type="button" data-range="5Y" aria-label="Пять лет">5Y</button>
                <button type="button" data-range="ALL" class="active" aria-label="Весь период">ALL</button>
              </div>
            </div>
            <div id="chart"></div>
          </div>

    const assetChartBindings = new WeakMap();

    function bindAssetChartTooltip(chart, asset, rows, yTitle, lineColor) {
      if (!chart?.on) return;
      chart.dataset.assetTooltipBound = "core";
      let tooltip = chart.querySelector(".asset-chart-tooltip");
      if (!tooltip) {
        tooltip = document.createElement("div");
        tooltip.className = "asset-chart-tooltip";
        tooltip.setAttribute("role", "status");
        chart.appendChild(tooltip);
      }
      let guide = chart.querySelector(".asset-chart-hover-line");
      if (!guide) {
        guide = document.createElement("span");
        guide.className = "asset-chart-hover-line";
        guide.setAttribute("aria-hidden", "true");
        chart.appendChild(guide);
      }
      const previous = assetChartBindings.get(chart);
      if (previous?.show && chart.removeListener) chart.removeListener("plotly_hover", previous.show);
      if (previous?.click && chart.removeListener) chart.removeListener("plotly_click", previous.click);
      if (previous?.unhover && chart.removeListener) chart.removeListener("plotly_unhover", previous.unhover);
      if (previous?.track) chart.removeEventListener("mousemove", previous.track, true);
      if (previous?.leave) chart.removeEventListener("mouseleave", previous.leave);
      if (previous?.scrollHide) window.removeEventListener("scroll", previous.scrollHide, true);
      const coarse = window.matchMedia?.("(pointer: coarse)")?.matches === true;
      const binding = { pointer: null, touchLocked: false };
      const hide = force => {
        if (!force && coarse && binding.touchLocked) return;
        tooltip.classList.remove("is-visible");
        guide.classList.remove("is-visible");
      };
      const track = source => {
        const rect = chart.getBoundingClientRect();
        const plotRect = chart.querySelector(".nsewdrag")?.getBoundingClientRect();
        const x = source.clientX - rect.left;
        const y = source.clientY - rect.top;
        const insideChart = x >= 0 && x <= rect.width && y >= 0 && y <= rect.height;
        const insidePlot = !plotRect || (source.clientX >= plotRect.left && source.clientX <= plotRect.right && source.clientY >= plotRect.top && source.clientY <= plotRect.bottom);
        binding.pointer = insideChart && insidePlot ? { x, y, at: Date.now() } : null;
      };
      const place = (point, source) => {
        const rect = chart.getBoundingClientRect();
        const axisPoint = point.xaxis?.d2p ? point.xaxis.d2p(point.x) : point.xaxis?.l2p ? point.xaxis.l2p(point.x) : NaN;
        const axisX = (Number.isFinite(axisPoint) ? axisPoint : rect.width / 2) + (point.xaxis?._offset || 0);
        const eventX = Number(source?.clientX) - rect.left;
        const eventY = Number(source?.clientY) - rect.top;
        const pointerFresh = binding.pointer && Date.now() - binding.pointer.at < 400;
        const rawX = pointerFresh ? binding.pointer.x : (Number.isFinite(eventX) && eventX >= 0 && eventX <= rect.width ? eventX : axisX);
        const rawY = pointerFresh ? binding.pointer.y : (Number.isFinite(eventY) && eventY >= 0 && eventY <= rect.height ? eventY : rect.height / 2);
        const width = tooltip.offsetWidth;
        const height = tooltip.offsetHeight;
        let left = rawX + 16;
        if (left + width > rect.width - 8) left = rawX - width - 16;
        tooltip.style.left = `${Math.max(8, Math.min(rect.width - width - 8, left))}px`;
        tooltip.style.top = `${Math.max(8, Math.min(rect.height - height - 8, rawY - height / 2))}px`;
        const plotRect = chart.querySelector(".nsewdrag")?.getBoundingClientRect();
        guide.style.left = `${axisX}px`;
        guide.style.top = `${plotRect ? plotRect.top - rect.top : 10}px`;
        guide.style.height = `${plotRect ? plotRect.height : Math.max(0, rect.height - 48)}px`;
        guide.classList.add("is-visible");
      };
      const showModel = (event, lock = false) => {
        const point = event.points?.[0];
        if (!point) return hide(true);
        const row = rows.find(item => String(item.date) === String(point.x));
        if (!row) return hide(true);
        binding.touchLocked = lock;
        const displayDate = dateRu(row.date);
        const metricValue = state.mode === "yield"
          ? pct(row.yield, 2)
          : asset.assetType === "rate"
            ? `${num(row.price, 2)}%`
            : `${num(row.price, 2)}${asset.assetType === "bond" ? "%" : ` ${currencyLabel(asset.currency)}`}`;
        const turnoverMetric = asset.assetType === "rate"
          ? ""
          : `<span class="asset-chart-tooltip__metric"><i style="--tooltip-color:rgba(16,18,21,.20)"></i>Оборот</span><strong>${htmlEsc(money(row.turnover || 0, "RUB", 0))}</strong>`;
        tooltip.innerHTML = `<span class="asset-chart-tooltip__period">${htmlEsc(displayDate)}</span>
          ${turnoverMetric}
          <span class="asset-chart-tooltip__metric"><i style="--tooltip-color:${htmlEsc(lineColor)}"></i>${htmlEsc(yTitle)}</span><strong>${htmlEsc(metricValue)}</strong>`;
        tooltip.classList.add("is-visible");
        requestAnimationFrame(() => place(point, event.event || {}));
      };
      const show = event => showModel(event, false);
      const click = event => showModel(event, true);
      const unhover = () => hide(false);
      const leave = () => { binding.pointer = null; hide(false); };
      const scrollHide = () => hide(true);
      Object.assign(binding, { show, click, unhover, track, leave, scrollHide });
      assetChartBindings.set(chart, binding);
      chart.addEventListener("mousemove", track, { capture: true, passive: true });
      chart.addEventListener("mouseleave", leave, { passive: true });
      window.addEventListener("scroll", scrollHide, { capture: true, passive: true });
      chart.on("plotly_hover", show);
      chart.on("plotly_click", click);
      chart.on("plotly_unhover", unhover);
    }

    function renderChart(asset) {
      const allRows = filteredHistory(asset);
      const valueKey = state.mode === "yield" ? "yield" : "price";
      const rows = allRows.filter(row => Number(row[valueKey]) > 0);
      const x = rows.map(row => row.date);
      const price = rows.map(row => row.price);
      const yieldClose = rows.map(row => row.yield);
      const turnover = rows.map(row => row.turnover || 0);
      const showTurnover = asset.assetType !== "rate" && turnover.some(value => Number(value) > 0);
      const y = state.mode === "yield" ? yieldClose : price;
      const yTitle = state.mode === "yield" ? "Доходность, %" : (asset.chartLabel || (asset.assetType && asset.assetType !== "bond" ? `Цена, ${asset.currency || "RUB"}` : "Цена, %"));
      const yRange = adaptiveAxisRange(y, state.mode === "yield" ? "yield" : "price");
      const turnoverRange = adaptiveAxisRange(turnover, "turnover");
      const lineColor = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
      const hasPlotly = typeof Plotly !== "undefined";
      if (!hasPlotly) {
        document.getElementById("chart").innerHTML = "<div class='desc'>Plotly.js не загрузился. Подключите интернет или положите локальный plotly.min.js рядом с HTML.</div>";
        return;
      }
      if (!rows.length) {
        Plotly.purge("chart");
        document.getElementById("chart").innerHTML = `<div class="chart-empty">${state.mode === "yield" ? "История доходности MOEX отсутствует" : "История котировок MOEX отсутствует"}</div>`;
        return;
      }
      const traces = [
        ...(showTurnover ? [{
          type: "bar",
          x,
          y: turnover,
          yaxis: "y2",
          marker: { color: "rgba(16,18,21,.10)", line: { width: 0 } },
          hoverinfo: "none",
          name: "Оборот"
        }] : []),
        {
          type: "scatter",
          mode: "lines",
          x,
          y,
          connectgaps: true,
          line: {
            color: lineColor,
            width: 4,
            shape: asset.assetType === "rate" ? "hv" : "spline",
            smoothing: asset.assetType === "rate" ? 0 : 1.15
          },
          fill: "none",
          fillcolor: `${lineColor}18`,
          hoverinfo: "none",
          name: yTitle
        }
      ];
      Plotly.react("chart", traces, {
        margin: { l: 42, r: showTurnover ? 42 : 18, t: 10, b: 38 },
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        hovermode: "x unified",
        showlegend: false,
        xaxis: {
          tickfont: { color: "rgba(16,18,21,.48)", size: 11 },
          gridcolor: "rgba(16,18,21,.06)",
          zeroline: false,
          rangeslider: { visible: false }
        },
        yaxis: {
          title: "",
          tickfont: { color: "rgba(16,18,21,.50)", size: 11 },
          gridcolor: "rgba(16,18,21,.08)",
          zeroline: false,
          range: yRange
        },
        yaxis2: {
          visible: showTurnover,
          overlaying: "y",
          side: "right",
          showgrid: false,
          tickfont: { color: "rgba(16,18,21,.38)", size: 11 },
          zeroline: false,
          range: turnoverRange
        },
      }, { responsive: true, displayModeBar: false }).then(() => bindAssetChartTooltip(document.getElementById("chart"), asset, rows, yTitle, lineColor));
    }

    function render() {
      const asset = ASSETS[state.assetIndex];
      renderLogo(asset);
      renderSummary(asset);
      renderDetailCta(asset);
      renderCashflow(asset);
      renderChart(asset);
      setActiveButtons("assetButtons", "asset", String(state.assetIndex));
      setActiveButtons("rangeButtons", "range", state.range);
      setActiveButtons("modeButtons", "mode", state.mode);
      requestAnimationFrame(() => {
        applyLogoAccentFromImage();
        renderChart(ASSETS[state.assetIndex]);
      });
    }

    renderButtons();
    render();
    window.addEventListener("resize", () => renderChart(ASSETS[state.assetIndex]));
  </script>
  <script src="../assets/integration-shell.js" defer></script>
</body>
</html>
