  <style>
    :root {

      --bg-b: #faf7ef;
      --bg-c: #f6fbf7;
      --ink: #101215;
      --muted: rgba(16, 18, 21, .62);
      --faint: rgba(16, 18, 21, .42);
      --line: rgba(255, 255, 255, .72);
      --glass: rgba(255, 255, 255, .56);
      --glass-strong: rgba(255, 255, 255, .76);
      --shadow: 0 28px 86px rgba(25, 34, 48, .17);
      --radius: 30px;
      --accent: #7A1027;
      --accent-soft: rgba(122, 16, 39, .16);
      --panel: rgba(255,255,255,.55);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: var(--ink);

      padding: clamp(16px, 3vw, 42px);
      overflow-x: hidden;

      position: fixed;
      inset: 0;
      pointer-events: none;

    .shell {

      display: grid;
      gap: 18px;

    .asset-switcher {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 22px;
      background: rgba(255,255,255,.42);
      backdrop-filter: blur(28px) saturate(170%);
      box-shadow: 0 16px 46px rgba(32, 42, 64, .11);
    }
    .switch-group, .range-group, .mode-group { display: flex; gap: 7px; flex-wrap: wrap; }
    button {
      border: 0;
      min-height: 44px;
      border-radius: 15px;
      padding: 0 14px;
      font: 700 13px/1 system-ui, sans-serif;
      color: rgba(16,18,21,.72);
      background: rgba(255,255,255,.58);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 8px 20px rgba(20,32,56,.08);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, color .18s ease;
    }
    button:hover { transform: translateY(-1px); }
    button.active {
      color: #fff;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent), #0b1f16 6%), color-mix(in srgb, var(--accent), #ffffff 18%));
    }
    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.76), rgba(255,255,255,.44)),
        linear-gradient(220deg, color-mix(in srgb, var(--accent), white 88%), rgba(255,255,255,.26));
      backdrop-filter: blur(36px) saturate(180%);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.88);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, rgba(255,255,255,.72), transparent 26%),
        linear-gradient(145deg, var(--accent-soft), transparent 36%);
      pointer-events: none;
    }
    .content {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, .9fr);
      gap: clamp(18px, 3vw, 34px);
      padding: clamp(18px, 3vw, 34px);
    }
    .topline {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    .logo {
      width: 74px;
      height: 74px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--accent);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 16px 38px color-mix(in srgb, var(--accent), transparent 72%);
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .logo-fallback { color: #fff; font-weight: 900; font-size: 22px; }
    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 58px);
      line-height: 1.02;
      letter-spacing: 0;
    }
    .subtitle {
      margin-top: 10px;
      max-width: 720px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }
    .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
    .chip {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0 11px;
      font-size: 12px;
      font-weight: 800;
      color: rgba(16,18,21,.7);
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(255,255,255,.74);
    }
    .chip.tint { color: color-mix(in srgb, var(--accent), #052515 38%); background: var(--accent-soft); }
    .price-panel {
      margin-top: clamp(22px, 4vw, 44px);
      display: grid;
      grid-template-columns: .84fr 1.16fr;
      gap: 16px;
      align-items: stretch;
    }
    .quote {
      min-height: 142px;
      padding: 20px;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75);
    }
    .quote-value { font-size: clamp(30px, 5vw, 58px); line-height: .92; font-weight: 900; letter-spacing: 0; white-space: nowrap; }
    .quote-rub { margin-top: 8px; color: var(--muted); font-size: 18px; font-weight: 750; }
    .delta { margin-top: 12px; font-size: 17px; font-weight: 850; color: #6a7077; }
    .delta.positive { color: #04884f; }
    .delta.negative { color: #c5203d; }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .metric {
      min-height: 66px;
      min-width: 0;
      padding: 13px 14px;
      border-radius: 19px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.68);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
      overflow: hidden;
    }
    .metric.hot { background: rgba(255,255,255,.50); }
    .metric-value { font-size: 22px; line-height: 1.05; font-weight: 900; color: rgba(16,18,21,.90); overflow-wrap: normal; word-break: normal; hyphens: none; }
    .metric-value.text { font-size: 18px; line-height: 1.1; overflow-wrap: normal; word-break: normal; }
    .metric-value.long { font-size: 16px; line-height: 1.13; }
    .metric-value.date { font-size: 17px; font-weight: 780; color: var(--muted); }
    .metric-label { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.12; }
    .metric-note { margin-top: 5px; color: var(--faint); font-size: 11px; line-height: 1.15; overflow-wrap: normal; word-break: normal; hyphens: none; }
    .returns-grid {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .return-pill {
      min-width: 0;
      border-radius: 15px;
      padding: 10px 11px;
      background: rgba(255,255,255,.46);
      border: 1px solid rgba(255,255,255,.62);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.66);
    }
    .return-label { color: var(--muted); font-size: 11px; font-weight: 780; line-height: 1; }
    .return-value { margin-top: 5px; font-size: 15px; line-height: 1; font-weight: 900; color: #6a7077; white-space: nowrap; }
    .return-value.positive { color: #04884f; }
    .return-value.negative { color: #c5203d; }
    .return-note { margin-top: 5px; color: var(--faint); font-size: 10px; font-weight: 720; line-height: 1; white-space: nowrap; }
    .chart-panel {
      margin-top: 18px;
      padding: 14px 14px 10px;
      border-radius: 26px;
      background: rgba(255,255,255,.48);
      border: 1px solid rgba(255,255,255,.66);
    }
    .detail-cta {
      display: none;
      margin-top: 16px;
      justify-content: flex-start;
    }
    .detail-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent), transparent 72%);
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 760;
      box-shadow: 0 10px 22px color-mix(in srgb, var(--accent), transparent 76%);
    }
    .detail-link:hover {
      background: color-mix(in srgb, var(--accent), #101827 15%);
    }
    #chart { height: 354px; width: 100%; }
    .chart-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .chart-toolbar .range-group { justify-content: flex-end; }
    .chart-toolbar .range-group button { padding: 0 10px; }
    .side {
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .tiles {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .tile, .section {
      border-radius: 21px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.68);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
    }
    .tile { min-height: 83px; min-width: 0; padding: 15px; overflow: hidden; }
    .tile strong {
      display: block;
      max-width: 100%;
      font-size: 19px;
      line-height: 1.08;
      overflow-wrap: anywhere;
      word-break: normal;
      text-wrap: balance;
    }
    .tile strong.fit {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(13px, var(--fit-size, 19px), 19px);
    }
    .tile strong.money { white-space: nowrap; overflow-wrap: normal; }
    .tile-date { display: inline-block; margin-left: 5px; color: var(--muted); font-size: 13px; font-weight: 780; white-space: nowrap; vertical-align: baseline; }
    .tile-date.solo { margin-left: 0; font-size: 16px; }
    .tile span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.15; }
    .section { padding: 16px; }
    .section h2 { margin: 0 0 12px; font-size: 16px; line-height: 1; }
    .desc { color: rgba(16,18,21,.72); font-size: 13px; line-height: 1.46; }
    .formula {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      padding: 12px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--accent-soft), white 42%);
      color: rgba(16,18,21,.72);
      font-size: 12px;
      line-height: 1.35;
    }
    .formula strong { color: color-mix(in srgb, var(--accent), #071c12 44%); font-size: 15px; }
    .cashflow { display: grid; gap: 8px; max-height: 420px; overflow: auto; padding-right: 3px; }
    .flow-row {
      min-height: 46px;
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 8px 11px;
      border-radius: 14px;
      background: rgba(255,255,255,.45);
    }
    .flow-date, .flow-note { color: var(--muted); font-size: 12px; }
    .flow-row.past { opacity: .72; }
    .flow-main { min-width: 0; }
    .flow-title { font-size: 13px; font-weight: 850; color: rgba(16,18,21,.74); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flow-value { font-size: 14px; font-weight: 850; text-align: right; white-space: nowrap; }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(16,18,21,.07);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    details.coupon-history {
      margin-top: 4px;
      border-radius: 18px;
      background: rgba(255,255,255,.34);
      border: 1px solid rgba(255,255,255,.58);
      overflow: hidden;
    }
    details.coupon-history summary {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 850;
      font-size: 12px;
      list-style: none;

    details.coupon-history summary span:last-child { color: var(--muted); font-weight: 760; }

    .coupon-table {

      gap: 6px;
      max-height: 290px;
      overflow: auto;
      padding: 0 10px 10px;
    }
    .footer-note {
      color: var(--faint);
      font-size: 12px;
      padding: 0 clamp(18px, 3vw, 34px) clamp(18px, 3vw, 28px);
      position: relative;
    }
    body.in-drawer {
      padding: 0;

      .logo { width: 62px; height: 62px; border-radius: 18px; }

      body.in-drawer #chart { height: 270px; }
      body.in-drawer .footer-note { padding: 0 12px 16px; }
    }
  </style>

    const trimFixed = (value, digits = 2) => {

      if (out.includes(".")) out = out.replace(/0+$/g, "").replace(/\.$/g, "");

    const pct = (value, digits = 2) => value === null || value === undefined || Number.isNaN(value) ? "—" : `${trimFixed(value, digits)}%`;

    const money = (value, currency = "RUB", digits = 0) => {

    };

      const unit = currencyLabel(currency);

    function rgbSaturation(r, g, b) {

    function applyLogoAccentFromImage() {
      const img = document.querySelector("#logo img");
      if (!img || !img.complete || !img.naturalWidth || !img.naturalHeight) return;
      try {
        const canvas = document.createElement("canvas");
        const size = 48;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        if (!ctx) return;
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0, 0, size, size).data;
        const buckets = new Map();
        for (let i = 0; i < data.length; i += 4) {
          const alpha = data[i + 3];
          if (alpha < 80) continue;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          const lightness = (Math.max(r, g, b) + Math.min(r, g, b)) / 510;
          if (lightness > .92 || lightness < .08 || rgbSaturation(r, g, b) < .16) continue;
          const key = `${Math.round(r / 18)}:${Math.round(g / 18)}:${Math.round(b / 18)}`;
          const current = buckets.get(key) || { r: 0, g: 0, b: 0, weight: 0 };
          const weight = alpha / 255 * (0.6 + rgbSaturation(r, g, b));
          current.r += r * weight;
          current.g += g * weight;
          current.b += b * weight;
          current.weight += weight;
          buckets.set(key, current);
        }
        let best = null;
        for (const bucket of buckets.values()) {
          if (!best || bucket.weight > best.weight) best = bucket;
        }
        if (!best || best.weight <= 0) return;
        const color = rgbToHex(best.r / best.weight, best.g / best.weight, best.b / best.weight);
        document.documentElement.style.setProperty("--accent", normalizeAccent(color));
        document.documentElement.style.setProperty("--accent-soft", hexToSoft(color));
      } catch (error) {
        return;
      }
    }

    function adaptiveAxisRange(values, mode = "price") {
      const clean = values.map(Number).filter(Number.isFinite);
      if (clean.length < 2) return undefined;
      const min = Math.min(...clean);
      const max = Math.max(...clean);
      if (min === max) {
        const padFlat = Math.max(Math.abs(min) * .03, mode === "turnover" ? 1 : .01);
        return [min - padFlat, max + padFlat];
      }
      const span = max - min;
      const mid = (max + min) / 2;
      const pad = Math.max(span * .12, Math.abs(mid) * .006, mode === "turnover" ? 1 : .01);
      return [Math.max(0, min - pad), max + pad];
    }

        document.getElementById("cashflow").innerHTML = rows.length ? rows.map(item => `<div class="flow-row">
          <div class="flow-date">${dateRu(item.date)}</div>
          <div class="flow-main"><div class="flow-title">Дивиденд</div><div class="flow-note">${dividendNote(item)}</div></div>
          <div class="flow-value">${dividendValue(item, asset)}</div>
        </div>`).join("") : `<div class="desc">В локальном пакете нет дивидендного календаря.</div>`;
        return;
      }
      if (asset.assetType === "fund") {
        document.getElementById("cashflowTitle").textContent = "Состав БПИФ";
        document.getElementById("cashflow").innerHTML = (asset.fundComposition || []).map(item => `<div class="flow-row">
          <div class="flow-date">${item.label}</div>
          <div class="flow-main"><div class="flow-title">${item.value || "—"}</div><div class="flow-note">${asset.secid}</div></div>
          <div class="flow-value"></div>
        </div>`).join("");
        return;
      }
      document.getElementById("cashflowTitle").textContent = "Денежный поток";
      const couponRows = (asset.futureCoupons || []).map(item => ({ ...item, type: "Купон" })).sort((a, b) => String(a.date).localeCompare(String(b.date)));
      const yearEnd = `${new Date().getFullYear()}-12-31`;
      const coupons = asset.couponType === "Флоатер" ? couponRows.filter(item => String(item.date) <= yearEnd) : couponRows.slice(0, 6);
      const amort = (asset.futureAmortizations || []).map(item => ({ ...item, type: "Погашение" })).sort((a, b) => String(a.date).localeCompare(String(b.date))).slice(0, 2);
      if (!amort.length && asset.maturityDate) amort.push({ date: asset.maturityDate, value: asset.faceValue, rate: 100, currency: asset.currency, type: "Погашение" });
      const rows = [...coupons, ...amort].sort((a, b) => String(a.date).localeCompare(String(b.date)));
      const historyRows = (asset.allCoupons || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const missingCouponHtml = !couponRows.length
        ? `<div class="desc">Будущие купоны не раскрыты в локальном пакете${asset.couponType === "Флоатер" ? ": ставка появится ближе к купонному периоду." : "."}</div>`
        : "";
      const cashflowHtml = rows.length ? rows.map(item => {
        return `<div class="flow-row">
          <div class="flow-date">${dateRu(item.date)}</div>
          <div class="flow-main"><div class="flow-title">${item.type}${item.type === "Купон" && item.rate ? ` · ${pct(item.rate)}` : ""}</div><div class="flow-note">${item.type === "Погашение" ? "номинал · плановая выплата" : item.status ? couponStatus(item.status) : "плановая выплата"}</div></div>
          <div class="flow-value">${money(item.value, item.currency || asset.currency, item.type === "Купон" ? 2 : 0)}</div>
        </div>`;
      }).join("") : `<div class="desc">Будущие купоны не раскрыты в локальном пакете. Для флоатеров это нормально: ставка часто появляется ближе к купонному периоду.</div>`;
      const historyHtml = historyRows.length ? `<details class="coupon-history"><summary><span>Прошлые купоны</span><span>${historyRows.length} выплат</span></summary><div class="coupon-table">${historyRows.map(item => {
        return `<div class="flow-row past">
          <div class="flow-date">${dateRu(item.date)}</div>
          <div class="flow-main"><div class="flow-title">Купон${item.rate ? ` · ${pct(item.rate)}` : ""}</div><div class="flow-note">факт</div></div>
          <div class="flow-value">${money(item.value, item.currency || asset.currency, 2)}</div>
        </div>`;
      }).join("")}</div></details>` : "";
      document.getElementById("cashflow").innerHTML = missingCouponHtml + cashflowHtml + historyHtml;
    }

    function renderChart(asset) {
      const allRows = filteredHistory(asset);
      const valueKey = state.mode === "yield" ? "yield" : "price";
      const rows = allRows.filter(row => Number(row[valueKey]) > 0);
      const x = rows.map(row => row.date);
      const price = rows.map(row => row.price);
      const yieldClose = rows.map(row => row.yield);
      const turnover = rows.map(row => row.turnover || 0);
      const y = state.mode === "yield" ? yieldClose : price;
      const yTitle = state.mode === "yield" ? "Доходность, %" : (asset.assetType && asset.assetType !== "bond" ? `Цена, ${asset.currency || "RUB"}` : "Цена, %");
      const yRange = adaptiveAxisRange(y, state.mode === "yield" ? "yield" : "price");
      const turnoverRange = adaptiveAxisRange(turnover, "turnover");
      const lineColor = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
      const hasPlotly = typeof Plotly !== "undefined";
      if (!hasPlotly) {
        document.getElementById("chart").innerHTML = "<div class='desc'>Plotly.js не загрузился. Подключите интернет или положите локальный plotly.min.js рядом с HTML.</div>";
        return;
      }
      if (!rows.length) {
        Plotly.purge("chart");
        document.getElementById("chart").innerHTML = `<div class="chart-empty">${state.mode === "yield" ? "История доходности MOEX отсутствует" : "История котировок MOEX отсутствует"}</div>`;
        return;
      }
      Plotly.react("chart", [
        {
          type: "bar",
          x,
          y: turnover,
          yaxis: "y2",
          marker: { color: "rgba(16,18,21,.10)", line: { width: 0 } },
          hovertemplate: "%{x}<br>Оборот: %{y:,.0f} ₽<extra></extra>",
          name: "Оборот"
        },
        {
          type: "scatter",
          mode: "lines",
          x,
          y,
          connectgaps: true,
          line: { color: lineColor, width: 4, shape: "spline", smoothing: 1.15 },
          fill: "none",
          fillcolor: `${lineColor}18`,
          hovertemplate: `%{x}<br>${yTitle}: %{y:.2f}<extra></extra>`,
          name: yTitle
        }
      ], {
        margin: { l: 42, r: 42, t: 10, b: 38 },
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        hovermode: "x unified",
        showlegend: false,
        xaxis: {
          tickfont: { color: "rgba(16,18,21,.48)", size: 11 },
          gridcolor: "rgba(16,18,21,.06)",
          zeroline: false,
          rangeslider: { visible: false }
        },
        yaxis: {
          title: "",
          tickfont: { color: "rgba(16,18,21,.50)", size: 11 },
          gridcolor: "rgba(16,18,21,.08)",
          zeroline: false,
          range: yRange
        },
        yaxis2: {
          overlaying: "y",
          side: "right",
          showgrid: false,
          tickfont: { color: "rgba(16,18,21,.38)", size: 11 },
          zeroline: false,
          range: turnoverRange
        },
        hoverlabel: {
          bgcolor: "rgba(255,255,255,.92)",
          bordercolor: "rgba(255,255,255,.9)",
          font: { color: "#101215" }
        }
      }, { responsive: true, displayModeBar: false });
    }

    function render() {
      const asset = ASSETS[state.assetIndex];
      renderLogo(asset);
      renderSummary(asset);
      renderDetailCta(asset);
      renderCashflow(asset);
      renderChart(asset);
      setActiveButtons("assetButtons", "asset", String(state.assetIndex));
      setActiveButtons("rangeButtons", "range", state.range);
      setActiveButtons("modeButtons", "mode", state.mode);
      requestAnimationFrame(() => {
        applyLogoAccentFromImage();
        renderChart(ASSETS[state.assetIndex]);
      });
    }

    renderButtons();
    render();
    window.addEventListener("resize", () => renderChart(ASSETS[state.assetIndex]));
  </script>
  <script src="../assets/integration-shell.js" defer></script>
</body>
</html>
