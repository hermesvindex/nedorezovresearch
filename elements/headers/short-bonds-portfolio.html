<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Header — Портфель коротких облигаций</title>
  <link rel="stylesheet" href="../assets/header-system.css">
  <script src="../assets/header-system.js" defer></script>
</head>
<body class="component-page">
  <main class="component-preview">
    <header class="product-header product-header--info product-header--mature">
      <div class="product-header__copy">
        <p class="product-header__eyebrow">Модельный портфель · Облигации</p>
        <h2 class="product-header__title" id="mature-title">Портфель коротких облигаций</h2>

      </div>
      <div class="product-header__utility">
        <div class="product-header__meta">
          <div class="meta-list">
            <span class="meta-item"><span class="meta-item__label">Данные</span><b class="meta-item__value">10.07.2026</b></span>
            <span class="meta-item"><span class="meta-item__label">Расчётная дата</span><b class="meta-item__value">13.07.2026</b></span>
            <span class="meta-item"><span class="meta-item__label">Подходящих бумаг</span><b class="meta-item__value">105</b></span>
            <span class="meta-item"><span class="meta-item__label">Ребалансов</span><b class="meta-item__value">17</b></span>
          </div>
        </div>
      </div>
    </header>
