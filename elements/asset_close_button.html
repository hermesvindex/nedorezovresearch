<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nedorezov Research — кнопка закрытия карточки</title>
  <link rel="stylesheet" href="assets/header-system.css">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 78% 18%, rgba(53, 143, 157, .72), transparent 34%),
        radial-gradient(circle at 18% 84%, rgba(60, 93, 143, .48), transparent 38%),
        linear-gradient(135deg, #0f2233, #274c63 56%, #15324a);
    }

    .close-button-stage {
      position: relative;
      width: min(360px, calc(100vw - 48px));
      min-height: 190px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 32px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .035));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .34),
        0 28px 70px rgba(3, 15, 25, .30);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
    }

    .close-button-stage::before {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(114, 218, 206, .20);
      filter: blur(28px);
      transform: translate(60px, -32px);
    }

    .stage-caption {
      position: absolute;
      left: 18px;
      bottom: 15px;
      margin: 0;
      color: rgba(216, 226, 231, .72);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="close-button-stage">
    <button class="asset-close-button" type="button" aria-label="Закрыть карточку актива">
      <span class="asset-close-button__icon" aria-hidden="true"></span>
    </button>
    <p class="stage-caption">Asset close · 46 px</p>
  </main>
</body>
</html>
