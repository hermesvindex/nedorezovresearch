 или по закрытой подписке. график аукционов с информацией о датах проведения и плановом объёме размещения публикуется на сайте министерства ежеквартально.\r\nминистерство финансов рф определяет основные направления государственной долговой политики российской федерации. одноименный документ публикуется на сайте минфина.\r\nминфин выпускает следующие виды офз:\r\n• офз-пд – облигации федерального займа с постоянным (фиксированным) доходом. ставка купона определяется до размещения и фиксируется до погашения.\r\n• офз-пк – облигации федерального займа с переменным купоном. ставка купона привязана к ставке ruonia. с 2019 года купонный доход рассчитывается исходя из среднего значения ставок ruonia за текущий, а не истекший как для прежних выпусков офз-пк, купонный период с небольшим \"техническим\" временным лагом в 7 календарных дней.\r\n• офз-ин – облигации федерального займа с индексируемым номиналом. для индексации номинала используется индекс потребительских цен российской федерации, ежемесячно публикуемый росстатом.\r\n• офз-ад – облигации федерального займа с амортизацией долга. номинал по данным облигациям гасится частями.\r\n• офз-н – облигации федерального займа для населения. приобретать офз-н могут только физические лица – граждане российской федерации напрямую через банки-агенты: сбербанк, втб, промсвязьбанк и почта банк. на бирже офз-н не обращаются.\r\nранее минфин выпускал следующие виды бумаг (сегодня находятся в обращении):\r\n• гсо – государственные сберегательные облигации. процентные ставки по таким облигациям устанавливались постоянными – гсо-ппс (для всех купонных периодов определена единая процентная ставка) или фиксированными – гсо-фпс (для всех купонных периодов процентная ставка определена, но не совпадает). гсо предназначались для резидентов, крупных институциональных инвесторов. последнее размещение состоялось в октябре 2012 года.\r\nописание других видов государственных облигаций, которые минфин размещал в прошлом, доступно в разделе \"глосс ке. график аукционов с информацией о датах проведения и плановом объёме размещения публикуется на сайте министерства ежеквартально.\r\nминистерство финансов рф определяет основные направления государственной долговой политики российской федерации. одноименный документ публикуется на сайте минфина.\r\nминфин выпускает следующие виды офз:\r\n• офз-пд – облигации федерального займа с постоянным (фиксированным) доходом. ставка купона определяется до размещения и фиксируется до погашения.\r\n• офз-пк – облигации федерального займа с переменным купоном. ставка купона привязана к ставке ruonia. с 2019 года купонный доход рассчитывается исходя из среднего значения ставок ruonia за текущий, а не истекший как для прежних выпусков офз-пк, купонный период с небольшим \"техническим\" временным лагом в 7 календарных дней.\r\n• офз-ин – облигации федерального займа с индексируемым номиналом. для индексации номинала используется индекс потребительских цен российской федерации, ежемесячно публикуемый росстатом.\r\n• офз-ад – облигации федерального займа с амортизацией долга. номинал по данным облигациям гасится частями.\r\n• офз-н – облигации федерального займа для населения. приобретать офз-н могут только физические лица – граждане российской федерации напрямую через банки-агенты: сбербанк, втб, промсвязьбанк и почта банк. на бирже офз-н не обращаются.\r\nранее минфин выпускал следующие виды бумаг (сегодня находятся в обращении):\r\n• гсо – государственные сберегательные облигации. процентные ставки по таким облигациям устанавливались постоянными – гсо-ппс (для всех купонных периодов определена единая процентная ставка) или фиксированными – гсо-фпс (для всех купонных периодов процентная ставка определена, но не совпадает). гсо предназначались для резидентов, крупных институциональных инвесторов. последнее размещение состоялось в октябре 2012 года.\r\nописание других видов государственных облигаций, которые минфин размещал в прошлом, доступно в разделе \"глоссарий\" на сайте cbonds. ию (организаторов). потенциальными приобретателями являются физические и юридические лица, резиденты и нерезиденты российской федерации.\r\nмакроэкономика:\r\nэкономика россии в 2025 году зафиксировала ускорение роста, достигнув годового показателя ввп в 1%.\r\nгодовая инфляция по состоянию на 2026-03-31 замедлилась до 5.03%, при этом регулятор снизил ключевую ставку до уровня 15%.\r\nпо состоянию на 2026-02-28 промышленное производство россии изменилось на -0.9% г/г. pmi в сфере услуг на 2026-03-31 составил 49.5 пунктов.\r\nфискальная политика страны отражает бюджетный дефицит, который по состоянию на 2026-03-31 составил 4576 млрд rub.\r\nторговый баланс россии имеет положительное значение, составив 5353 млн usd на 2026-02-28. экспорт на 2026-02-28 составил 30123 млн usd, а импорт за этот же период - 24770 млн usd. Министерство финансов Российской Федерации","issuer_id":"1228","issuer_name":"Министерство финансов Российской Федерации","href":"../asset/index.html?id=SU29027RMFS8"},{"id":3085,"secid":"SU29028RMFS6","source_secid":"SU29028RMFS6","board":"TQOB","title":"ОФЗ-ПК 29028 22/10/2039","subtitle":"ОФЗ 29028 OFZ-PK 29028","isin":"RU000A10D4Z9","bond_class":"ОФЗ","price_pct":94.374,"nominal_value":1000.0,"nominal_currency":"RUB","nominal_display":"1 000 RUB","coupon_rate_pct":14.47,"current_yield_pct":15.283871,"raw_coupon_rate_pct":14.47,"raw_current_yield_pct":15.283871,"ytm_pct":null,"ytm_moex_pct":null,"ytm_calc_pct":null,"key_rate_pct":14.25,"coupon_spread_pct":0.22,"current_yield_spread_pct":1.033871,"ytm_spread_pct":null,"zspread_pct":1.26,"coupon_is_forecast":false,"ytm_is_forecast":false,"floater_spread_estimate_pct":0.143913,"forecast_key_rate_pct":14.005435,"coupon_type":"Флоатер","coupon_frequency":4.0,"next_coupon_date":"2026-10-22","maturity_date":"2039-10-22","credit_rating":"AAA","duration_years":5.956164,"face_currency":"RUB","accint":0.79,"dirty_price":944.53,"annual_coupon_amount":141.493476,"monthly_turnover":4881757204.93,"avg_daily_turnover
