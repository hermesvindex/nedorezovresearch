вода \"куюмба-тайшет\". нефтеперерабатывающий комплекс \"славнефти\" включает два крупных предприятия – \"славнефть-янос\" (рф) и \"мозырский нпз\" (рб). \r\nдебютный выпуск облигаций \"славнефть\" был осуществлен в 2001 г., когда были размещены 1-лет. дисконтные бумаги на 1 млрд рублей, в качестве анддерайтера выступила ик \"тройка диалог\" (сейчас sber cib). стоит отметить, что с 2003 г. по 2018 г., компания не выходила на внутренний долговой рынок, при этом никогда не осуществляла займов на международном рынке. Публичное акционерное общество \"Нефтегазовая компания \"Славнефть\"","issuer_id":"9587","issuer_name":"Публичное акционерное общество \"Нефтегазовая компания \"Славнефть\"","href":"../asset/index.html?id=RU000A103PD0"},{"id":504,"secid":"RU000A103PG3","source_secid":"RU000A103PG3","board":"TQCB","title":"Славнефть БО 002Р-02","subtitle":"Славнеф2Р2 SLAVNEFT 002P-02","isin":"RU000A103PG3","bond_class":"Корпоративные","price_pct":null,"nominal_value":1000.0,"nominal_currency":"RUB","nominal_display":"1 000 RUB","coupon_rate_pct":7.75,"current_yield_pct":null,"raw_coupon_rate_pct":7.75,"raw_current_yield_pct":null,"ytm_pct":null,"ytm_moex_pct":null,"ytm_calc_pct":null,"key_rate_pct":null,"coupon_spread_pct":null,"current_yield_spread_pct":null,"ytm_spread_pct":null,"zspread_pct":null,"coupon_is_forecast":false,"ytm_is_forecast":false,"floater_spread_estimate_pct":null,"forecast_key_rate_pct":null,"coupon_type":"Фикс","coupon_frequency":4.0,"next_coupon_date":"2026-09-08","maturity_date":"2031-09-02","credit_rating":"AA","duration_years":null,"face_currency":"RUB","accint":9.13,"dirty_price":null,"annual_coupon_amount":77.28,"monthly_turnover":0.0,"avg_daily_turnover":0.0,"weekly_turnover":0.0,"avg_week_turnover":0.0,"avg_turnover":0.0,"color":"#DCEBFA","logo_color":"#203050","logo_path":"../assets/logos/d2d1b26be09d30d32a15.png","cashflow_coverage_full":false,"asof":"2026-07-22","search_blob":"ru000a103pg3 ru000a103pg3 славнефть бо 002р-02 славнеф2р2 slavnef
