<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Соби-Лизинг 001Р-05 · Карточка актива</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg-a: #eef4f8;
      --bg-b: #f8faf8;
      --ink: #101215;
      --muted: rgba(16, 18, 21, .62);
      --faint: rgba(16, 18, 21, .42);
      --line: rgba(255, 255, 255, .72);
      --glass: rgba(255, 255, 255, .56);
      --glass-strong: rgba(255, 255, 255, .76);
      --shadow: 0 24px 70px rgba(23, 32, 48, .18);
      --radius: 30px;
      --accent: #0ea56b;
      --accent-soft: rgba(14, 165, 107, .16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 12%, rgba(98, 190, 235, .32), transparent 34%),
        radial-gradient(circle at 84% 10%, rgba(76, 212, 146, .25), transparent 30%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b));
      padding: clamp(16px, 3vw, 42px);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.42) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.45), transparent 72%);
    }
    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }
    .asset-switcher {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 22px;
      background: rgba(255,255,255,.42);
      backdrop-filter: blur(28px) saturate(170%);
      box-shadow: 0 14px 46px rgba(32, 42, 64, .12);
    }
    .switch-group, .range-group, .mode-group { display: flex; gap: 7px; flex-wrap: wrap; }
    button {
      border: 0;
      min-height: 38px;
      border-radius: 15px;
      padding: 0 14px;
      font: 700 13px/1 system-ui, sans-serif;
      color: rgba(16,18,21,.72);
      background: rgba(255,255,255,.58);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75), 0 8px 20px rgba(20,32,56,.08);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, color .18s ease;
    }
    button:hover { transform: translateY(-1px); }
    button.active {
      color: #fff;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent), #0b1f16 6%), color-mix(in srgb, var(--accent), #ffffff 18%));
    }
    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(255,255,255,.72), rgba(255,255,255,.42));
      backdrop-filter: blur(36px) saturate(180%);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.88);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(115deg, rgba(255,255,255,.72), transparent 26%),
        radial-gradient(circle at 20% 0%, var(--accent-soft), transparent 38%);
      pointer-events: none;
    }
    .content {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, .9fr);
      gap: clamp(18px, 3vw, 34px);
      padding: clamp(18px, 3vw, 34px);
    }
    .topline {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }
    .logo {
      width: 74px;
      height: 74px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--accent);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.38), 0 16px 38px color-mix(in srgb, var(--accent), transparent 72%);
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .logo-fallback { color: #fff; font-weight: 900; font-size: 22px; }
    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 58px);
      line-height: .92;
      letter-spacing: 0;
    }
    .subtitle {
      margin-top: 10px;
      max-width: 720px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }
    .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 14px; }
    .chip {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0 11px;
      font-size: 12px;
      font-weight: 800;
      color: rgba(16,18,21,.7);
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(255,255,255,.74);
    }
    .chip.tint { color: color-mix(in srgb, var(--accent), #052515 38%); background: var(--accent-soft); }
    .price-panel {
      margin-top: clamp(22px, 4vw, 44px);
      display: grid;
      grid-template-columns: .84fr 1.16fr;
      gap: 16px;
      align-items: stretch;
    }
    .quote {
      min-height: 142px;
      padding: 20px;
      border-radius: 24px;
      background: rgba(255,255,255,.52);
      border: 1px solid rgba(255,255,255,.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.75);
    }
    .quote-value { font-size: clamp(30px, 5vw, 58px); line-height: .92; font-weight: 900; letter-spacing: 0; white-space: nowrap; }
    .quote-rub { margin-top: 8px; color: var(--muted); font-size: 18px; font-weight: 750; }
    .delta { margin-top: 12px; font-size: 17px; font-weight: 850; color: #6a7077; }
    .delta.positive { color: #04884f; }
    .delta.negative { color: #c5203d; }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .metric {
      min-height: 66px;
      min-width: 0;
      padding: 13px 14px;
      border-radius: 19px;
      background: rgba(255,255,255,.50);
      border: 1px solid rgba(255,255,255,.68);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
      overflow: hidden;
    }
    .metric.hot { background: rgba(255,255,255,.50); }
    .metric-value { font-size: 22px; line-height: 1.05; font-weight: 900; color: rgba(16,18,21,.90); overflow-wrap: normal; word-break: normal; hyphens: none; }
    .metric-value.text { font-size: 18px; line-height: 1.1; overflow-wrap: normal; word-break: normal; }
    .metric-value.long { font-size: 16px; line-height: 1.13; }
    .metric-value.date { font-size: 17px; font-weight: 780; color: var(--muted); }
    .metric-label { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.12; }
    .metric-note { margin-top: 5px; color: var(--faint); font-size: 11px; line-height: 1.15; overflow-wrap: normal; word-break: normal; hyphens: none; }
    .returns-grid {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .return-pill {
      min-width: 0;
      border-radius: 15px;
      padding: 10px 11px;
      background: rgba(255,255,255,.42);
      border: 1px solid rgba(255,255,255,.62);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.66);
    }
    .return-label { color: var(--muted); font-size: 11px; font-weight: 780; line-height: 1; }
    .return-value { margin-top: 5px; font-size: 15px; line-height: 1; font-weight: 900; color: #6a7077; white-space: nowrap; }
    .return-value.positive { color: #04884f; }
    .return-value.negative { color: #c5203d; }
    .return-note { margin-top: 5px; color: var(--faint); font-size: 10px; font-weight: 720; line-height: 1; white-space: nowrap; }
    .chart-panel {
      margin-top: 18px;
      padding: 14px 14px 10px;
      border-radius: 26px;
      background: rgba(255,255,255,.42);
      border: 1px solid rgba(255,255,255,.66);
    }
    #chart { height: 354px; width: 100%; }
    .chart-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .chart-toolbar .range-group { justify-content: flex-end; }
    .chart-toolbar .range-group button { padding: 0 10px; }
    .side {
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .tiles {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .tile, .section {
      border-radius: 21px;
      background: rgba(255,255,255,.48);
      border: 1px solid rgba(255,255,255,.68);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
    }
    .tile { min-height: 83px; min-width: 0; padding: 15px; overflow: hidden; }
    .tile strong {
      display: block;
      max-width: 100%;
      font-size: 19px;
      line-height: 1.08;
      overflow-wrap: anywhere;
      word-break: normal;
      text-wrap: balance;
    }
    .tile strong.fit {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(13px, var(--fit-size, 19px), 19px);
    }
    .tile strong.money { white-space: nowrap; overflow-wrap: normal; }
    .tile-date { display: inline-block; margin-left: 5px; color: var(--muted); font-size: 13px; font-weight: 780; white-space: nowrap; vertical-align: baseline; }
    .tile-date.solo { margin-left: 0; font-size: 16px; }
    .tile span { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.15; }
    .section { padding: 16px; }
    .section h2 { margin: 0 0 12px; font-size: 16px; line-height: 1; }
    .desc { color: rgba(16,18,21,.72); font-size: 13px; line-height: 1.46; }
    .formula {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      padding: 12px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--accent-soft), white 42%);
      color: rgba(16,18,21,.72);
      font-size: 12px;
      line-height: 1.35;
    }
    .formula strong { color: color-mix(in srgb, var(--accent), #071c12 44%); font-size: 15px; }
    .cashflow { display: grid; gap: 8px; max-height: 420px; overflow: auto; padding-right: 3px; }
    .flow-row {
      min-height: 46px;
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 8px 11px;
      border-radius: 14px;
      background: rgba(255,255,255,.45);
    }
    .flow-date, .flow-note { color: var(--muted); font-size: 12px; }
    .flow-row.past { opacity: .72; }
    .flow-main { min-width: 0; }
    .flow-title { font-size: 13px; font-weight: 850; color: rgba(16,18,21,.74); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flow-value { font-size: 14px; font-weight: 850; text-align: right; white-space: nowrap; }
    .status {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(16,18,21,.07);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    details.coupon-history {
      margin-top: 4px;
      border-radius: 18px;
      background: rgba(255,255,255,.34);
      border: 1px solid rgba(255,255,255,.58);
      overflow: hidden;
    }
    details.coupon-history summary {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 850;
      font-size: 12px;
      list-style: none;
    }
    details.coupon-history summary span:last-child { color: var(--muted); font-weight: 760; }
    details.coupon-history summary:focus { outline: none; }
    details.coupon-history summary:focus-visible { box-shadow: inset 0 0 0 2px rgba(16,18,21,.12); }
    details.coupon-history summary::-webkit-details-marker { display: none; }
    .coupon-table {
      display: grid;
      gap: 6px;
      max-height: 290px;
      overflow: auto;
      padding: 0 10px 10px;
    }
    .footer-note {
      color: var(--faint);
      font-size: 12px;
      padding: 0 clamp(18px, 3vw, 34px) clamp(18px, 3vw, 28px);
      position: relative;
    }
    body.in-drawer {
      padding: 0;
      background:
        radial-gradient(circle at 18% 8%, rgba(98, 190, 235, .24), transparent 32%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b));
    }
    body.in-drawer::before { display: none; }
    body.in-drawer .shell { width: 100%; }
    body.in-drawer .asset-switcher { display: none; }
    body.in-drawer .card {
      border-radius: 0;
      min-height: 100vh;
      border: 0;
      box-shadow: none;
    }
    body.in-drawer .content {
      grid-template-columns: 1fr;
      padding: 14px;
      gap: 14px;
    }
    body.in-drawer .metric-grid { grid-template-columns: 1fr 1fr; }
    body.in-drawer .chart-panel { margin-top: 14px; }
    body.in-drawer #chart { height: 290px; }
    body.in-drawer .footer-note { padding: 0 14px 18px; }
    @media (max-width: 980px) {
      .content { grid-template-columns: 1fr; }
      .side { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      body { padding: 10px; }
      .asset-switcher { border-radius: 19px; }
      .content { padding: 14px; gap: 16px; }
      .topline { grid-template-columns: auto 1fr; }
      .logo { width: 62px; height: 62px; border-radius: 18px; }
      .price-panel, .tiles { grid-template-columns: 1fr; }
      .metric-grid { grid-template-columns: 1fr 1fr; }
      .returns-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .chart-toolbar .range-group { justify-content: flex-start; }
      #chart { height: 316px; }
      .flow-row { grid-template-columns: 82px minmax(0, 1fr) auto; }
      button { flex: 1 1 auto; }
    }
    @media (max-width: 640px), (max-height: 760px) {
      body.in-drawer .content { padding: 12px; gap: 12px; }
      body.in-drawer #chart { height: 270px; }
      body.in-drawer .footer-note { padding: 0 12px 16px; }
    }
  

    :root {
      --bg-a: #F2F2F2 !important;
      --bg-b: #FFFFFF !important;
      --ink: #111111 !important;
      --muted: rgba(43,43,43,.62) !important;
      --faint: rgba(43,43,43,.42) !important;
      --line: rgba(17,17,17,.10) !important;
      --glass: rgba(255,255,255,.62) !important;
      --glass-strong: rgba(255,255,255,.82) !important;
      --radius: 28px !important;
    }
    body {
      background:
        linear-gradient(rgba(255,255,255,.34) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.30) 1px, transparent 1px),
        radial-gradient(circle at 16% 8%, color-mix(in srgb, var(--accent), transparent 88%), transparent 27%),
        radial-gradient(circle at 84% 4%, rgba(138,138,138,.18), transparent 24%),
        linear-gradient(180deg, #F2F2F2 0%, #FFFFFF 46%, #D9D9D9 100%) !important;
      background-size: 112px 112px, 112px 112px, auto, auto, auto !important;
    }
    .card,
    .asset-switcher,
    .quote,
    .metric,
    .return-pill,
    .chart-panel,
    .side-card,
    .flow-row,
    .scenario-card,
    .section-card,
    .chip,
    button,
    .detail-link {
      border-radius: var(--radius) !important;
      border-color: rgba(17,17,17,.10) !important;
    }
    .card {
      background:
        radial-gradient(circle at 18% 0%, color-mix(in srgb, var(--accent), transparent 88%), transparent 34%),
        linear-gradient(145deg, rgba(255,255,255,.86), rgba(242,242,242,.66)) !important;
      box-shadow: 0 24px 70px rgba(17,17,17,.12), inset 0 1px 0 rgba(255,255,255,.86) !important;
    }
    .logo {
      border-radius: var(--radius) !important;
      background: var(--accent) !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.34), 0 16px 38px color-mix(in srgb, var(--accent), transparent 76%) !important;
    }
    button.active,
    .detail-link {
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent), #111111 8%), color-mix(in srgb, var(--accent), #111111 22%)) !important;
      color: #FFFFFF !important;
    }
    .chip.tint {
      color: color-mix(in srgb, var(--accent), #111111 36%) !important;
      background: var(--accent-soft) !important;
    }

  

  
    /* bondsmap asset second pass fixes */
    .asset-switcher,
    .footer-note,
    body.in-drawer .asset-switcher,
    body.in-drawer .footer-note {
      display: none !important;
    }

  
    /* bondsmap asset drawer recovery */
    html,
    body.in-drawer {
      background: #FFFFFF !important;
      height: auto !important;
      min-height: 100% !important;
      overflow: auto !important;
      overscroll-behavior: contain !important;
    }
    body.in-drawer {
      padding: 0 !important;
    }
    body.in-drawer::before {
      display: none !important;
    }
    body.in-drawer .shell {
      width: 100% !important;
      min-height: 100% !important;
      gap: 0 !important;
    }
    body.in-drawer .asset-switcher,
    body.in-drawer .footer-note,
    .footer-note {
      display: none !important;
      height: 0 !important;
      max-height: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      overflow: hidden !important;
    }
    body.in-drawer .card {
      min-height: 100% !important;
      height: auto !important;
      margin: 0 !important;
      background: #FFFFFF !important;
      border-radius: var(--radius) !important;
      overflow: visible !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
    }
    body.in-drawer .card::before {
      display: none !important;
    }
    body.in-drawer .content {
      position: relative !important;
      z-index: 1 !important;
      padding-bottom: 0 !important;
    }

  
    /* bondsmap asset drawer recovery v2 */
    html.drawer-mode,
    html.drawer-mode body,
    body.in-drawer {
      padding: 0 !important;
      height: auto !important;
      min-height: 100% !important;
      background: #FFFFFF !important;
      overflow: auto !important;
      overscroll-behavior: contain !important;
    }
    html.drawer-mode body::before,
    body.in-drawer::before { display: none !important; }
    html.drawer-mode body .shell,
    body.in-drawer .shell {
      width: 100% !important;
      min-height: 100% !important;
      gap: 0 !important;
    }
    html.drawer-mode body .asset-switcher,
    html.drawer-mode body .footer-note,
    body.in-drawer .asset-switcher,
    body.in-drawer .footer-note,
    .footer-note {
      display: none !important;
      height: 0 !important;
      max-height: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
      overflow: hidden !important;
    }
    html.drawer-mode body .card,
    body.in-drawer .card {
      min-height: 100% !important;
      height: auto !important;
      margin: 0 !important;
      background: #FFFFFF !important;
      border-radius: var(--radius) !important;
      overflow: visible !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow: none !important;
    }
    html.drawer-mode body .card::before,
    body.in-drawer .card::before { display: none !important; }
    html.drawer-mode body .content,
    body.in-drawer .content {
      position: relative !important;
      z-index: 1 !important;
      padding-bottom: 0 !important;
    }

  </style>

<body>
  <main class="shell">
    <nav class="asset-switcher">
      <div class="switch-group" id="assetButtons"></div>
    </nav>

    <article class="card" id="assetCard">
      <div class="content">
        <section>
          <div class="topline">
            <div class="logo" id="logo"></div>
            <div>
              <h1 id="title"></h1>
              <div class="subtitle" id="subtitle"></div>
              <div class="chips" id="chips"></div>
            </div>
          </div>

          <div class="price-panel">
            <div class="quote">
              <div class="quote-value" id="price"></div>
              <div class="quote-rub" id="dirtyPrice"></div>
              <div class="delta" id="delta"></div>
            </div>
            <div class="metric-grid" id="metrics"></div>
            <div class="returns-grid" id="periodReturns"></div>
          </div>

          <div class="chart-panel">
            <div class="chart-toolbar">
              <div class="mode-group" id="modeButtons">
                <button data-mode="price" class="active">Цена</button>
                <button data-mode="yield">Доходность</button>
              </div>
              <div class="range-group" id="rangeButtons">
                <button data-range="D">День</button>
                <button data-range="W">Неделя</button>
                <button data-range="1M">1М</button>
                <button data-range="3M">3М</button>
                <button data-range="6M">6М</button>
                <button data-range="YTD">YTD</button>
                <button data-range="1Y">Год</button>
                <button data-range="3Y">3Г</button>
                <button data-range="5Y">5Л</button>
                <button data-range="ALL" class="active">Всё</button>
              </div>
            </div>
            <div id="chart"></div>
          </div>
        </section>

        <aside class="side">
          <div class="tiles" id="tiles"></div>
          <section class="section">

          [asset.etfCompany || "—", "Управляющая компания"],
          [asset.etfStructure || "—", "Структура"],
          [asset.avgTurnover ? compactMoney(asset.avgTurnover) : "—", "Средний оборот за 60 торговых дней"],
          [pct(asset.annualReturn), "Ожидаемая доходность"],
          [pct(asset.annualVol), "Риск"],
          [asset.isin || "—", "ISIN"],
        ] : [
          [asset.marketCap ? compactMoney(asset.marketCap) : "—", "Капитализация"],
          [asset.turnover ? compactMoney(asset.turnover) : "—", "Оборот за день"],
          [asset.volume ? nb(rub.format(asset.volume)) : "—", "Объем, шт."],
          [asset.pe ? num(asset.pe, 2) : "—", "P/E"],
          [asset.pb ? num(asset.pb, 2) : "—", "P/B"],
          [lastDividend, "Последний дивиденд"],
        ]);
        const extra = isFund
          ? `<div class="formula"><strong>${asset.etfStructure || "Состав БПИФ"}</strong><span>УК: ${asset.etfCompany || "—"}</span>${asset.note ? `<span>${asset.note}</span>` : ""}</div>`
          : `<div class="formula"><strong>${asset.sector || "Сектор"}</strong><span>${[asset.industry, asset.issuer].filter(Boolean).join(" · ") || "Отраслевые данные из локального справочника"}</span></div>`;
        document.getElementById("description").innerHTML = `${asset.description || "Описание недоступно."}${extra}`;
        document.getElementById("footerNote").textContent = `Источник: local moex_library/packages/${asset.secid} · portfolio_interactive · данные на ${dateRu(asset.asof)}`;
        return;
      }
      renderPeriodReturns(asset);
      document.getElementById("subtitle").textContent = `${asset.subtitle} · ${asset.issuer}`;
      document.getElementById("chips").innerHTML = [
        asset.isin,
        asset.board,
        asset.isCurrencyBond ? "Валютная" : "",
        asset.couponType,
        asset.class,
        asset.currency
      ].filter(Boolean).map((item, i) => `<span class="chip ${i >= 2 && i <= 4 ? "tint" : ""}">${item}</span>`).join("");
      document.getElementById("price").textContent = pct(asset.price, 2);
      document.getElementById("dirtyPrice").textContent = asset.dirtyPrice ? money(asset.dirtyPrice, asset.currency, 2) : `${num((asset.price || 0) * (asset.faceValue || 1000) / 100, 2)}\u00a0${currencyLabel(asset.currency)}`;
      const sign = (asset.priceDelta || 0) >= 0 ? "+" : "";
      setDelta(asset.priceDelta, asset.priceDelta === null || asset.priceDelta === undefined ? "—" : `${sign}${num(asset.priceDelta)} п.п. (${sign}${pct(asset.priceDeltaPct)})`);
      const floatingRateReference = asset.couponBenchmark === "Ключевая ставка Банка России" && asset.keyRate
        ? ` · КС ЦБ ${pct(asset.keyRate.value)}`
        : "";
      const floatingYieldNote = asset.couponFormulaShort
        ? `${asset.couponFormulaShort}${floatingRateReference}`
        : "";
      const couponNote = asset.couponValue ? `${money(asset.couponValue, asset.currency, 2)} · ${dateRu(asset.nextCouponDate)} · ${couponStatus(asset.couponStatus)}` : "";
      const metrics = [];
      if (asset.couponType === "Структурная") {
        metrics.push(["Тип", "Структурная", "купон/доходность зависят от условий продукта", false]);
        metrics.push(["Погашение", dateRu(asset.maturityDate), "", false]);
        metrics.push(["НКД", money(asset.accint), "", false]);
        metrics.push(["Рейтинг", asset.rating || "—", "", false]);
      } else if (asset.couponType === "Флоатер") {
        metrics.push(["Купонная доходность", pct(asset.couponRate), couponNote || floatingYieldNote, false]);
        metrics.push(["Текущая доходность", pct(asset.currentYield), floatingYieldNote || "годовой купон / чистая цена", false]);
        metrics.push(["НКД", money(asset.accint), "", false]);
        metrics.push(["Рейтинг", asset.rating || "—", "", false]);
      } else {
        metrics.push(["Купон", pct(asset.couponRate), couponNote, false]);
        metrics.push(["Текущая доходность", pct(asset.currentYield), "годовой купон / чистая цена", false]);
        metrics.push(["Доходность к погашению / MOEX", pct(asset.ytm), "", false]);
        metrics.push(["Рейтинг", asset.rating || "—", "", false]);
      }
      document.getElementById("metrics").innerHTML = metrics.map(([label, value, note, hot]) => {
        return `<div class="metric ${hot ? "hot" : ""}"><div class="${metricValueClass(value)}">${value}</div><div class="metric-label">${label}</div>${note ? `<div class="metric-note">${note}</div>` : ""}</div>`;
      }).join("");
      document.getElementById("tiles").innerHTML = renderTiles([
        [money(asset.faceValue, asset.currency), "Номинал"],
        [asset.avgTurnover ? compactMoney(asset.avgTurnover) : "—", "Средний оборот за 60 торговых дней"],
        [asset.frequency ? num(asset.frequency, 0) : "—", "Купонов в год"],
        [dateRu(asset.issueDate), "Размещение"],
        [dateRu(asset.nextCouponDate), "Ближайший купон"],
        [dateRu(asset.maturityDate), `Погашение${asset.yearsToMaturity ? ` · ${num(asset.yearsToMaturity, 1)} г.` : ""}`]
      ]);
      const formulaReference = asset.couponBenchmark === "Ключевая ставка Банка России" && asset.keyRate
        ? `<span>Ориентир: ключевая ставка Банка России ${pct(asset.keyRate.value)} на ${dateRu(asset.keyRate.date)}.</span>`
        : asset.couponBenchmark
          ? `<span>Ориентир: ${asset.couponBenchmark}.</span>`
          : "";
      document.getElementById("description").innerHTML = `${asset.description}${asset.couponFormula ? `<div class="formula"><strong>${asset.couponFormulaShort || asset.couponType}</strong><span>${asset.couponFormula}</span>${formulaReference}</div>` : ""}`;
      document.getElementById("footerNote").textContent = `Источник: local moex_library/packages/${asset.secid} · данные на ${dateRu(asset.asof)}`;
    }

    function renderCashflow(asset) {
      if (asset.assetType === "stock") {
        document.getElementById("cashflowTitle").textContent = "Дивиденды";
        const rows = (asset.dividends || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 8);
        document.getElementById("cashflow").innerHTML = rows.length ? rows.map(item => `<div class="flow-row">
          <div class="flow-date">${dateRu(item.date)}</div>
          <div class="flow-main"><div class="flow-title">Дивиденд</div><div class="flow-note">${dividendNote(item)}</div></div>
          <div class="flow-value">${dividendValue(item, asset)}</div>
        </div>`).join("") : `<div class="desc">В локальном пакете нет дивидендного календаря.</div>`;
        return;
      }
      if (asset.assetType === "fund") {
        document.getElementById("cashflowTitle").textContent = "Состав БПИФ";
        document.getElementById("cashflow").innerHTML = (asset.fundComposition || []).map(item => `<div class="flow-row">
          <div class="flow-date">${item.label}</div>
          <div class="flow-main"><div class="flow-title">${item.value || "—"}</div><div class="flow-note">${asset.secid}</div></div>
          <div class="flow-value"></div>
        </div>`).join("");
        return;
      }
      document.getElementById("cashflowTitle").textContent = "Денежный поток";
      const couponRows = (asset.futureCoupons || []).map(item => ({ ...item, type: "Купон" })).sort((a, b) => String(a.date).localeCompare(String(b.date)));
      const yearEnd = `${new Date().getFullYear()}-12-31`;
      const coupons = asset.couponType === "Флоатер" ? couponRows.filter(item => String(item.date) <= yearEnd) : couponRows.slice(0, 6);
      const amort = (asset.futureAmortizations || []).map(item => ({ ...item, type: "Погашение" })).sort((a, b) => String(a.date).localeCompare(String(b.date))).slice(0, 2);
      if (!amort.length && asset.maturityDate) amort.push({ date: asset.maturityDate, value: asset.faceValue, rate: 100, currency: asset.currency, type: "Погашение" });
      const rows = [...coupons, ...amort].sort((a, b) => String(a.date).localeCompare(String(b.date)));
      const historyRows = (asset.allCoupons || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const missingCouponHtml = !couponRows.length
        ? `<div class="desc">Будущие купоны не раскрыты в локальном пакете${asset.couponType === "Флоатер" ? ": ставка появится ближе к купонному периоду." : "."}</div>`
        : "";
      const cashflowHtml = rows.length ? rows.map(item => {
        return `<div class="flow-row">
          <div class="flow-date">${dateRu(item.date)}</div>
          <div class="flow-main"><div class="flow-title">${item.type}${item.type === "Купон" && item.rate ? ` · ${pct(item.rate)}` : ""}</div><div class="flow-note">${item.type === "Погашение" ? "номинал · плановая выплата" : item.status ? couponStatus(item.status) : "плановая выплата"}</div></div>
          <div class="flow-value">${money(item.value, item.currency || asset.currency, item.type === "Купон" ? 2 : 0)}</div>
        </div>`;
      }).join("") : `<div class="desc">Будущие купоны не раскрыты в локальном пакете. Для флоатеров это нормально: ставка часто появляется ближе к купонному периоду.</div>`;
      const historyHtml = historyRows.length ? `<details class="coupon-history"><summary><span>Прошлые купоны</span><span>${historyRows.length} выплат</span></summary><div class="coupon-table">${historyRows.map(item => {
        return `<div class="flow-row past">
          <div class="flow-date">${dateRu(item.date)}</div>
          <div class="flow-main"><div class="flow-title">Купон${item.rate ? ` · ${pct(item.rate)}` : ""}</div><div class="flow-note">факт</div></div>
          <div class="flow-value">${money(item.value, item.currency || asset.currency, 2)}</div>
        </div>`;
      }).join("")}</div></details>` : "";
      document.getElementById("cashflow").innerHTML = missingCouponHtml + cashflowHtml + historyHtml;
    }

    function renderChart(asset) {
      const rows = filteredHistory(asset);
      const x = rows.map(row => row.date);
      const price = rows.map(row => row.price);
      const yieldClose = rows.map(row => row.yield);
      const turnover = rows.map(row => row.turnover || 0);
      const y = state.mode === "yield" ? yieldClose : price;
      const yTitle = state.mode === "yield" ? "Доходность, %" : (asset.assetType && asset.assetType !== "bond" ? `Цена, ${asset.currency || "RUB"}` : "Цена, %");
      const yRange = adaptiveChartRange(y, state.mode);
      const lineColor = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
      const hasPlotly = typeof Plotly !== "undefined";
      if (!hasPlotly) {
        document.getElementById("chart").innerHTML = "<div class='desc'>График недоступен: библиотека Plotly не загружена.</div>";
        return;
      }
      Plotly.react("chart", [
        {
          type: "bar",
          x,
          y: turnover,
          yaxis: "y2",
          marker: { color: "rgba(16,18,21,.10)", line: { width: 0 } },
          hovertemplate: "%{x}<br>Оборот: %{y:,.0f} ₽<extra></extra>",
          name: "Оборот"
        },
        {
          type: "scatter",
          mode: "lines",
          x,
          y,
          connectgaps: true,
          line: { color: lineColor, width: 4, shape: "spline", smoothing: 1.15 },
          fill: "none",
          fillcolor: `${lineColor}18`,
          hovertemplate: `%{x}<br>${yTitle}: %{y:.2f}<extra></extra>`,
          name: yTitle
        }
      ], {
        margin: { l: 42, r: 42, t: 10, b: 38 },
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        hovermode: "x unified",
        showlegend: false,
        xaxis: {
          tickfont: { color: "rgba(16,18,21,.48)", size: 11 },
          gridcolor: "rgba(16,18,21,.06)",
          zeroline: false,
          rangeslider: { visible: false }
        },
        yaxis: {
          title: "",
          tickfont: { color: "rgba(16,18,21,.50)", size: 11 },
          gridcolor: "rgba(16,18,21,.08)",
          range: yRange,
          zeroline: false
        },
        yaxis2: {
          overlaying: "y",
          side: "right",
          showgrid: false,
          tickfont: { color: "rgba(16,18,21,.38)", size: 11 },
          zeroline: false
        },
        hoverlabel: {
          bgcolor: "rgba(255,255,255,.92)",
          bordercolor: "rgba(255,255,255,.9)",
          font: { color: "#101215" }
        }
      }, { responsive: true, displayModeBar: false });
    }

    function render() {
      const asset = ASSETS[state.assetIndex];
      renderLogo(asset);
      renderSummary(asset);
      renderCashflow(asset);
      renderChart(asset);
      setActiveButtons("assetButtons", "asset", String(state.assetIndex));
      setActiveButtons("rangeButtons", "range", state.range);
      setActiveButtons("modeButtons", "mode", state.mode);
    }

    renderButtons();
    render();
    window.addEventListener("resize", () => renderChart(ASSETS[state.assetIndex]));
  </script>
</body>
</html>
